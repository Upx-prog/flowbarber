<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixFlow Pro</title>
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .bg-card { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .progress-bar { transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
        #menuSide { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans pb-32 overflow-x-hidden">

    <div id="menuOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/60 z-[60] hidden"></div>
    <div id="menuSide" class="fixed top-0 left-0 h-full w-72 bg-white z-[70] shadow-2xl transform -translate-x-full flex flex-col">
        <div class="p-6 bg-slate-900 text-white">
            <h2 class="font-black italic text-xl tracking-tighter text-indigo-400 text-center">PIXFLOW PRO</h2>
            <p class="text-[10px] text-slate-500 uppercase font-bold mt-1 text-center">Versão 1.2.0 - Offline Mode</p>
        </div>
        <nav class="flex-1 p-6 space-y-4">
            <p class="text-[10px] font-black text-slate-400 uppercase mb-3">Dados e Backup</p>
            <button onclick="baixarPlanilha()" class="w-full text-left p-3 hover:bg-slate-100 rounded-xl flex items-center gap-3 text-sm font-medium">📁 Exportar Excel (CSV)</button>
            <button onclick="backupWhatsapp()" class="w-full text-left p-3 hover:bg-slate-100 rounded-xl flex items-center gap-3 text-sm font-medium text-emerald-600">💬 Backup via WhatsApp</button>
            <hr class="my-4">
            <p class="text-[10px] font-black text-slate-400 uppercase mb-3">Sobre</p>
            <button onclick="verPrivacidade()" class="w-full text-left p-3 hover:bg-slate-100 rounded-xl text-sm font-medium">📄 Privacidade dos Dados</button>
            <button onclick="contatoDev()" class="w-full text-left p-3 hover:bg-slate-100 rounded-xl text-sm font-medium text-indigo-600">👨‍💻 Suporte Desenvolvedor</button>
        </nav>
    </div>

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col">
        
        <header class="bg-card p-6 text-white rounded-b-[2.5rem] shadow-xl">
            <div class="flex justify-between items-center mb-6">
                <button onclick="toggleMenu()" class="text-2xl p-2 -ml-2">☰</button>
                <button onclick="copiarAgenda()" class="text-[9px] bg-indigo-500/20 text-indigo-300 px-3 py-1.5 rounded-full border border-indigo-500/30 font-bold uppercase">📢 Status Agenda</button>
            </div>

            <div class="space-y-4">
                <div class="bg-white/5 p-4 rounded-2xl border border-white/10">
                    <p class="text-[9px] text-indigo-300 font-black uppercase mb-2">Processar Pagamento (Cole o Pix)</p>
                    <div class="flex gap-2">
                        <input type="text" id="inputPix" placeholder="Aguardando notificação..." class="flex-1 bg-white/10 border border-white/20 rounded-xl p-3 text-xs outline-none focus:border-indigo-400 text-white">
                        <button onclick="processarPix()" class="bg-indigo-600 px-5 rounded-xl font-black text-xs uppercase shadow-lg shadow-indigo-600/30">OK</button>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white/5 p-3 rounded-2xl border border-white/10 text-center">
                        <p class="text-[9px] text-indigo-300 uppercase font-black">Preço Corte</p>
                        <input type="number" id="cfgPreco" onchange="salvarCfg()" class="bg-transparent text-lg font-bold w-full outline-none text-center">
                    </div>
                    <div class="bg-white/5 p-3 rounded-2xl border border-white/10 text-center">
                        <p class="text-[9px] text-indigo-300 uppercase font-black">Meta Fidelidade</p>
                        <input type="number" id="cfgMeta" onchange="salvarCfg()" class="bg-transparent text-lg font-bold w-full outline-none text-center">
                    </div>
                </div>
            </div>
        </header>

        <div id="filaPendencias" class="p-4 space-y-3"></div>

        <main class="p-4 flex-1">
            <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Painel de Clientes</h2>
            <div id="listaClientes" class="space-y-4"></div>
        </main>
    </div>

    <button onclick="novoCliente()" class="fixed bottom-6 right-6 w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-2xl flex items-center justify-center text-3xl font-bold active:scale-90 z-50">+</button>

    <script>
        let db = JSON.parse(localStorage.getItem('pixflow_vFinal_db')) || {};
        let config = JSON.parse(localStorage.getItem('pixflow_vFinal_cfg')) || { preco: 35, meta: 10 };

        function render() {
            const container = document.getElementById('listaClientes');
            container.innerHTML = Object.keys(db).length ? '' : '<div class="text-center py-20 text-slate-300 font-medium italic">Nenhum cliente local.</div>';
            
            Object.keys(db).forEach(id => {
                const c = db[id];
                const progresso = (c.total % config.meta);
                const pct = (progresso / config.meta) * 100;

                container.innerHTML += `
                    <div class="bg-white border border-slate-200 p-5 rounded-[2rem] shadow-sm relative overflow-hidden">
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-2/3">
                                <h3 class="font-black text-slate-800 text-sm uppercase leading-tight">${c.nome}</h3>
                                <p class="text-[9px] text-slate-400 font-bold">📲 ${c.whatsapp}</p>
                            </div>
                            <div class="text-right">
                                <span class="block text-2xl font-black text-indigo-600 leading-none">${c.saldo}</span>
                                <span class="text-[8px] font-bold text-slate-400 uppercase">Créditos</span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="flex justify-between text-[8px] font-black uppercase text-slate-400 mb-1">
                                <span>Rumo ao Prêmio</span>
                                <span>${progresso}/${config.meta}</span>
                            </div>
                            <div class="h-2 bg-slate-100 rounded-full overflow-hidden border border-slate-100">
                                <div class="progress-bar h-full bg-indigo-500 rounded-full" style="width: ${pct}%"></div>
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <button onclick="zapMsg('${id}')" class="bg-green-50 text-green-700 text-[8px] font-black px-4 py-2 rounded-lg uppercase">Agradecer</button>
                            <button onclick="atender('${id}')" class="flex-1 bg-slate-900 text-white text-[9px] font-black py-2 rounded-lg uppercase tracking-widest">Registrar Uso (-1 Crédito)</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('cfgPreco').value = config.preco;
            document.getElementById('cfgMeta').value = config.meta;
        }

        function processarPix() {
            const texto = document.getElementById('inputPix').value;
            if(!texto) return;

            const valorMatch = texto.match(/R\$\s?(\d+,\d+)/);
            let nomeExtraido = "Cliente Desconhecido";
            if(texto.includes(" de ")) nomeExtraido = texto.split(" de ")[1].split(" R$")[0].trim();
            const valor = valorMatch ? parseFloat(valorMatch[1].replace(',', '.')) : config.preco;

            const idTemp = Date.now();
            const fila = document.getElementById('filaPendencias');
            const card = document.createElement('div');
            card.id = `pix-${idTemp}`;
            card.className = "bg-amber-50 border-2 border-amber-200 p-5 rounded-[2rem] shadow-lg scale-95 animate-pulse";
            card.innerHTML = `
                <div class="mb-4 text-center">
                    <p class="text-[9px] font-black text-amber-600 uppercase mb-1 tracking-widest italic">Novo Pix: ${nomeExtraido}</p>
                    <p class="text-xl font-black text-slate-900">R$ ${valor.toFixed(2)}</p>
                </div>
                <div class="flex flex-col gap-2">
                    <button onclick="conciliar('${idTemp}', '${nomeExtraido}', 'VISTA')" class="w-full bg-white border border-amber-300 text-amber-700 py-3 rounded-xl text-[10px] font-black uppercase">Cortou Agora (À Vista)</button>
                    <button onclick="conciliar('${idTemp}', '${nomeExtraido}', 'CREDITO')" class="w-full bg-amber-600 text-white py-3 rounded-xl text-[10px] font-black uppercase shadow-lg shadow-amber-600/30">Salvar para Depois (Crédito)</button>
                </div>
            `;
            fila.prepend(card);
            document.getElementById('inputPix').value = '';
        }

        function conciliar(idEl, nome, tipo) {
            const fone = prompt(`WhatsApp do cliente:`, "55");
            if(!fone) return;

            if(!db[fone]) db[fone] = { nome: nome, whatsapp: fone, saldo: 0, total: 0 };
            
            if(tipo === 'CREDITO') {
                db[fone].saldo += 1;
                alert("Crédito adicionado ao saldo!");
            } else {
                db[fone].total += 1;
                alert("Ponto de fidelidade registrado!");
            }
            document.getElementById(`pix-${idEl}`).remove();
            salvar(); render();
        }

        function atender(id) {
            if(db[id].saldo > 0) {
                if(confirm("Usar 1 crédito do saldo deste cliente?")) {
                    db[id].saldo--;
                    db[id].total++;
                }
            } else {
                if(confirm("Cliente sem saldo. Registrar serviço para fidelidade mesmo assim?")) {
                    db[id].total++;
                }
            }
            if(db[id].total % config.meta === 0 && db[id].total > 0) alert("🎁 PRÊMIO ATINGIDO!");
            salvar(); render();
        }

        function salvar() { localStorage.setItem('pixflow_vFinal_db', JSON.stringify(db)); }
        function salvarCfg() {
            config.preco = document.getElementById('cfgPreco').value;
            config.meta = document.getElementById('cfgMeta').value;
            localStorage.setItem('pixflow_vFinal_cfg', JSON.stringify(config));
            render();
        }

        function zapMsg(id) {
            const c = db[id];
            const msg = `Olá ${c.nome}! Obrigado pelo serviço hoje. Seu progresso para o prêmio está em ${c.total % config.meta}/${config.meta}.`;
            window.open(`https://wa.me/${c.whatsapp}?text=${encodeURIComponent(msg)}`);
        }

        function baixarPlanilha() {
            let csv = "WhatsApp;Nome;Saldo;Total\n";
            Object.keys(db).forEach(id => { csv += `${id};${db[id].nome};${db[id].saldo};${db[id].total}\n`; });
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "backup_clientes.csv"; link.click();
        }

        function toggleMenu() {
            const m = document.getElementById('menuSide');
            const o = document.getElementById('menuOverlay');
            const isOpen = m.style.transform === 'translateX(0px)';
            m.style.transform = isOpen ? 'translateX(-100%)' : 'translateX(0px)';
            o.classList.toggle('hidden');
        }

        function verPrivacidade() {
            alert("PRIVACIDADE: Seus dados nunca saem deste aparelho. O banco de dados é local e offline. Recomendamos exportar o CSV semanalmente para segurança.");
        }

        function novoCliente() {
            const n = prompt("Nome:");
            const w = prompt("WhatsApp (55...):", "55");
            if(n && w) { db[w] = { nome: n, whatsapp: w, saldo: 0, total: 0 }; salvar(); render(); }
        }

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
        render();
    </script>
</body>
</html>
